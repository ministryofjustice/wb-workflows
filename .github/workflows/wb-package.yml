name: Website Builder package

# Reusable workflow that builds a WordPress plugin or theme into a zip and
# publishes it as a GitHub release. Called from each plugin/theme repo with
# one of two modes:
#
# mode: release   (call on push to main)
#   Releases only when the Version header has been bumped to an untagged version:
#     - version unchanged (already tagged)   -> skip
#     - version bumped above the latest tag  -> build, tag X.Y.Z, release
#     - version untagged but not the highest -> fail
#
# mode: preview   (call from workflow_dispatch on any branch)
#   Always builds the chosen branch into a pre-release tagged
#   preview-<branch>-<short sha>, with the Version header inside the zip
#   stamped as X.Y.Z-preview.<short sha>. Never marked as latest, and ignored
#   when release mode looks for the latest version.
#
# What goes in the zip is listed by an rsync filter file in the calling repo
# (default .release-filter). The Composer package name and type for the
# preview notes are read from the calling repo's composer.json.
on:
  workflow_call:
    inputs:
      mode:
        description: "release or preview"
        required: true
        type: string
      version-file:
        description: File with the WordPress "Version:" header (the plugin's main PHP file, or style.css for a theme)
        required: true
        type: string
      package-name:
        description: Folder name inside the zip and the zip's filename prefix. Must match the plugin/theme folder name.
        required: true
        type: string
      filter-file:
        description: rsync filter file listing what goes in the zip
        default: .release-filter
        type: string
      build-command:
        default: npm run build
        type: string
      node-version:
        default: "22"
        type: string
    outputs:
      published:
        description: "'true' if a release or pre-release was published"
        value: ${{ jobs.package.outputs.published }}
      tag:
        value: ${{ jobs.package.outputs.tag }}

jobs:
  package:
    runs-on: ubuntu-latest
    # Releases queue up; a newer preview of the same branch replaces a running one.
    concurrency:
      group: wordpress-${{ inputs.mode }}-${{ github.repository }}-${{ inputs.mode == 'preview' && github.ref || 'main' }}
      cancel-in-progress: ${{ inputs.mode == 'preview' }}
    outputs:
      published: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check inputs
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            release) ;;
            preview)
              if [ "$GITHUB_REF_TYPE" != "branch" ]; then
                echo "::error::Run the preview on a branch, not a tag."
                exit 1
              fi ;;
            *)
              echo "::error::mode must be 'release' or 'preview', got '$MODE'."
              exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Release needs full history for the tags. (Written this way round
          # because 0 is falsy in expressions.)
          fetch-depth: ${{ inputs.mode == 'preview' && 1 || 0 }}

      - name: Plan
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          VERSION_FILE: ${{ inputs.version-file }}
          FILTER_FILE: ${{ inputs.filter-file }}
        run: |
          for f in "$VERSION_FILE" "$FILTER_FILE" composer.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f not found in the repository."
              exit 1
            fi
          done

          VERSION=$(sed -nE 's/^.*Version:[[:space:]]*([^[:space:]]+).*$/\1/p' "$VERSION_FILE" | head -n1)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version header '$VERSION' in $VERSION_FILE is not in X.Y.Z format."
            exit 1
          fi

          COMPOSER_NAME=$(jq -r '.name // empty' composer.json)
          COMPOSER_TYPE=$(jq -r '.type // empty' composer.json)
          {
            echo "version=$VERSION"
            echo "composer_name=$COMPOSER_NAME"
            echo "composer_type=$COMPOSER_TYPE"
          } >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "preview" ]; then
            SHORT_SHA="${GITHUB_SHA::7}"
            # Branch name -> tag-safe slug, e.g. "feature/Nav_Fix" -> "feature-nav-fix"
            SLUG=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
            TAG="preview-${SLUG}-${SHORT_SHA}"
            {
              echo "publish=true"
              echo "tag=$TAG"
              echo "short_sha=$SHORT_SHA"
              echo "package_version=${VERSION}-preview.${SHORT_SHA}"
            } >> "$GITHUB_OUTPUT"
            echo "Building preview $TAG."
            exit 0
          fi

          # Release mode
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only strict X.Y.Z tags count as releases (ignores preview-* tags).
          LATEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version $VERSION is lower than the latest release $LATEST. Bump the Version header in $VERSION_FILE above $LATEST."
              exit 1
            fi
          fi

          echo "Releasing $VERSION (previous: ${LATEST:-none})."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Node 22 ships npm 10, which rejects lock files written by npm 11.
      - name: Use npm 11
        if: steps.plan.outputs.publish == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build assets
        if: steps.plan.outputs.publish == 'true'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"

      - name: Assemble package
        if: steps.plan.outputs.publish == 'true'
        env:
          NAME: ${{ inputs.package-name }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION_FILE: ${{ inputs.version-file }}
          FILTER_FILE: ${{ inputs.filter-file }}
          PACKAGE_VERSION: ${{ steps.plan.outputs.package_version }}
        run: |
          PKG_DIR="wp-package/$NAME"
          mkdir -p "$PKG_DIR"
          rsync -a --prune-empty-dirs --filter="merge $FILTER_FILE" ./ "$PKG_DIR/"

          if [ ! -f "$PKG_DIR/$VERSION_FILE" ]; then
            echo "::error::$VERSION_FILE is not included by $FILTER_FILE."
            exit 1
          fi
          # Previews: show e.g. 2.3.2-preview.a1b2c3d in WordPress. Replaces the
          # first Version: value only; a no-op for releases.
          perl -0pi -e 's/(Version:[ \t]*)\S+/$1$ENV{PACKAGE_VERSION}/' "$PKG_DIR/$VERSION_FILE"
          grep -m1 'Version:' "$PKG_DIR/$VERSION_FILE"

          (cd wp-package && zip -rq "../${NAME}-${TAG}.zip" "$NAME")
          unzip -l "${NAME}-${TAG}.zip" | tail -n1

      - name: Write preview notes
        if: steps.plan.outputs.publish == 'true' && inputs.mode == 'preview'
        env:
          NAME: ${{ inputs.package-name }}
          TAG: ${{ steps.plan.outputs.tag }}
          COMPOSER_NAME: ${{ steps.plan.outputs.composer_name }}
          COMPOSER_TYPE: ${{ steps.plan.outputs.composer_type }}
        run: |
          cat > preview-notes.md <<EOF
          Preview build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. **Not for production.**

          To install it in hale-platform, replace this package's entry in \`repositories\` with:

          \`\`\`json
          {
            "type": "package",
            "package": {
              "name": "${COMPOSER_NAME}",
              "version": "dev-${TAG}",
              "type": "${COMPOSER_TYPE}",
              "dist": {
                "type": "zip",
                "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}-${TAG}.zip"
              }
            }
          }
          \`\`\`

          and require \`"${COMPOSER_NAME}": "dev-${TAG}"\`.

          Delete this preview when testing is done (not while an environment still uses it):
          \`gh release delete ${TAG} --cleanup-tag --yes -R ${GITHUB_REPOSITORY}\`
          EOF

      # Title the release after the PR that was merged, e.g. "2.3.3 - Fix nav keyboard focus".
      # Falls back to just the version for direct pushes, or if the lookup fails.
      - name: Name release after merged PR
        id: pr
        if: steps.plan.outputs.publish == 'true' && inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # On API errors gh prints the error body to stdout, so only trust it on success.
          if ! TITLE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq "map(select(.merged_at != null)) | (map(select(.merge_commit_sha == \"${GITHUB_SHA}\")) + .) | .[0].title // empty" \
            2>/dev/null); then
            TITLE=""
          fi
          if [ -n "$TITLE" ]; then
            NAME="${TAG} - ${TITLE}"
          else
            echo "::notice::No merged PR found for ${GITHUB_SHA}; titling the release '${TAG}'."
            NAME="$TAG"
          fi
          # Delimiter syntax so a title can't break the output file.
          {
            echo "name<<WB_RELEASE_NAME_EOF"
            echo "$NAME"
            echo "WB_RELEASE_NAME_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Release title: $NAME"

      - name: Publish release
        if: steps.plan.outputs.publish == 'true' && inputs.mode == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          name: ${{ steps.pr.outputs.name || steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ inputs.package-name }}-${{ steps.plan.outputs.tag }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Compare against the last real release, never a preview.
          previous_tag: ${{ steps.plan.outputs.latest }}

      - name: Publish pre-release
        if: steps.plan.outputs.publish == 'true' && inputs.mode == 'preview'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Preview: ${{ github.ref_name }} @ ${{ steps.plan.outputs.short_sha }}"
          body_path: preview-notes.md
          prerelease: true
          make_latest: false
          files: ${{ inputs.package-name }}-${{ steps.plan.outputs.tag }}.zip
          fail_on_unmatched_files: true
          overwrite_files: true
